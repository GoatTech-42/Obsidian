[package]
name = "obsidian-research-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.obsidian-research]
path = ".."
features = ["pq-hybrid"]

[workspace]

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hybrid"
path = "fuzz_targets/hybrid.rs"
test = false
doc = false
bench = false
