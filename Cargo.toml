[package]
name = "obsidian-research"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental encryption research lab, not a security product"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "=0.10.3"
chacha20poly1305 = "=0.10.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
zeroize = "=1.8.2"
wasm-bindgen = "=0.2.105"
getrandom = { version = "=0.2.17", features = ["js"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
