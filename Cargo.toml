[package]
name = "obsidian-research"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental encryption research lab, not a security product"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "=0.10.3"
chacha20poly1305 = "=0.10.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
zeroize = "=1.8.2"
wasm-bindgen = "=0.2.105"
getrandom = { version = "=0.2.17", features = ["js"] }
ml-kem = { version = "=0.3.4", optional = true }
ml-dsa = { version = "=0.1.2", optional = true }
x25519-dalek = { version = "=3.0.0", optional = true }
ed25519-dalek = { version = "=3.0.0", optional = true }
sha3 = { version = "=0.12.0", optional = true }
shake = { version = "=0.1.0", optional = true }
getrandom4 = { package = "getrandom", version = "0.4", optional = true }

[features]
# Hybrid classical + post-quantum key establishment and signatures. Native only, off by default.
pq-hybrid = ["dep:ml-kem", "dep:ml-dsa", "dep:x25519-dalek", "dep:ed25519-dalek", "dep:getrandom4", "dep:sha3", "dep:shake", "ml-kem/getrandom", "ml-dsa/getrandom", "ml-kem/zeroize", "ml-dsa/zeroize"]

xwing-derand = ["pq-hybrid", "ml-kem/hazmat"]

[dev-dependencies]
serde_json = "1"
ml-kem = { version = "=0.3.4", features = ["hazmat"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[[test]]
name = "hybrid"
required-features = ["xwing-derand"]

[[example]]
name = "hybrid_bench"
required-features = ["pq-hybrid"]

[[example]]
name = "hybrid_xcheck"
required-features = ["pq-hybrid"]
